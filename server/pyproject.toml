[project]
name = "pa-server"
version = "0.1.0"
description = "pa server: owns the ~/pa files, rollover, HTTP API and MCP"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pa-server = "pa_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pa_server"]
