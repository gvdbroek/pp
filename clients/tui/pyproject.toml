[project]
name = "pa-tui"
version = "0.1.0"
description = "Terminal views for pa: todos and notes, vim keys, $EDITOR for editing"
requires-python = ">=3.11"
dependencies = [
    "windows-curses; sys_platform == 'win32'",
]

[project.scripts]
pa-todos = "pa_tui.todos:main"
pa-notes = "pa_tui.notes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pa_tui"]
